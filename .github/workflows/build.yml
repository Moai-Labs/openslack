name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Every commit on the default branch gets its own image and verdict, so none is cancelled by a later push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and tests the repository's code with no registry credential anywhere on the runner: the tests run the
  # repository's own scripts, so nothing they could read may be worth stealing. The image leaves as an artifact.
  build:
    # Only the default branch is verified and publishes an image.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The image is named for the product app's own private registry, by the repository variable FLY_APP
      - name: Build
        run: |
          [ -n "${{ vars.FLY_APP }}" ] || { echo "The repository variable FLY_APP (the product app's name) is not set."; exit 1; }
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "registry.fly.io/${{ vars.FLY_APP }}:${GITHUB_SHA}" .

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The repository's own tests, when package.json has a test script; skipped otherwise.
      - name: Test
        run: |
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test
          else
            echo "No test script in package.json: tests skipped."
          fi

      # The built image as data, for the publish job
      - name: Save the image
        run: |
          docker save "registry.fly.io/${{ vars.FLY_APP }}:${GITHUB_SHA}" | gzip > image.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

      # The verdict, readable over git alone: refs/ci/pass/<sha> once the image is built and tested, refs/ci/fail/<sha>
      # otherwise. Custom refs are not branches or tags, so pushing one starts nothing.
      - name: Publish the verdict
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          result=pass
          if [ "${{ job.status }}" != success ]; then result=fail; fi
          git push origin "HEAD:refs/ci/$result/${{ github.sha }}"
          echo "$result ${{ github.sha }}"

  # Pushes the built image. A fresh runner that checks out nothing and runs none of the repository's code: it loads
  # the image as data and pushes it. The only job that sees the deploy token.
  publish:
    needs: [build]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load the image
        run: |
          gunzip -c image.tar.gz | docker load

      # The secret FLY_API_TOKEN is a deploy token for that one app: it can push there and nowhere else.
      - name: Log in to the container registry
        run: echo "${{ secrets.FLY_API_TOKEN }}" | docker login registry.fly.io --username x --password-stdin

      # Tagged with the commit only: a deploy names the commit it runs.
      - name: Push
        run: |
          docker push "registry.fly.io/${{ vars.FLY_APP }}:${GITHUB_SHA}"
